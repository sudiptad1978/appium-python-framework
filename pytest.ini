[pytest]
minversion = 8.2
testpaths = tests

# -ra            : show a summary of all outcomes (esp. reasons for skips)
# --strict-markers : typos in markers fail fast instead of silently passing
addopts = -ra --strict-markers -p no:cacheprovider

markers =
    android: test that only makes sense on Android (e.g. system back button)
    ios: test that only makes sense on iOS
    smoke: fast sanity checks; useful for a quick device/tooling smoke run
    login: TheApp login screen feature tests

# The framework logs to logs/ (see utils/logger.py) - keep pytest's own
# console output free of log noise:
log_cli = false
